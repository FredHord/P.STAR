<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder: long-exposure motion-blur high jumper arching over the bar, monochrome">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.94  0 0 0 0 0.95  0 0 0 0 0.94  0 0 0 0.06 0"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blurTight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <radialGradient id="vig" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1500" fill="#0c0c0c"/>

  <!-- bar line, faint -->
  <g opacity="0.18">
    <path d="M 260 760 L 940 760" stroke="#f1f3ef" stroke-width="4"/>
  </g>

  <!-- arcing body trail over the bar -->
  <g filter="url(#blurWide)" opacity="0.5">
    <path d="M 340 1000 Q 600 560 900 640 Q 1020 680 1000 820" stroke="#f1f3ef" stroke-width="34" fill="none" stroke-linecap="round"/>
  </g>

  <g filter="url(#blurTight)">
    <path d="M 400 980 Q 620 620 860 660" stroke="#f1f3ef" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.8"/>
    <ellipse cx="600" cy="650" rx="30" ry="27" fill="#f1f3ef" opacity="0.9"/>
    <path d="M 860 660 Q 940 700 960 780" stroke="#f1f3ef" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 620 700 Q 560 760 520 840" stroke="#f1f3ef" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 400 980 Q 340 1060 380 1140" stroke="#f1f3ef" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- echo arcs -->
  <g filter="url(#blurWide)" opacity="0.22">
    <path d="M 300 1040 Q 560 640 840 700" stroke="#f1f3ef" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.5"/>
  <rect width="1200" height="1500" fill="url(#vig)"/>
</svg>
