<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder: long-exposure motion-blur bicycle kick, monochrome">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.94  0 0 0 0 0.95  0 0 0 0 0.94  0 0 0 0.06 0"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blurTight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <radialGradient id="vig" cx="50%" cy="46%" r="76%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1500" fill="#0c0c0c"/>

  <!-- inverted swirl trail -->
  <g filter="url(#blurWide)" opacity="0.5">
    <path d="M 380 620 Q 560 520 700 600 Q 840 690 760 860 Q 700 990 540 980" stroke="#f1f3ef" stroke-width="32" fill="none" stroke-linecap="round"/>
  </g>

  <g filter="url(#blurTight)">
    <ellipse cx="470" cy="650" rx="30" ry="27" fill="#f1f3ef" opacity="0.9"/>
    <path d="M 470 680 Q 560 640 640 660" stroke="#f1f3ef" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 640 660 Q 760 720 720 840" stroke="#f1f3ef" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 720 840 Q 680 940 580 960" stroke="#f1f3ef" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 470 680 Q 420 760 460 840" stroke="#f1f3ef" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 640 660 Q 700 600 780 590" stroke="#f1f3ef" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- echo swirl -->
  <g filter="url(#blurWide)" opacity="0.2">
    <path d="M 340 700 Q 520 600 660 680 Q 780 750 720 880" stroke="#f1f3ef" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.5"/>
  <rect width="1200" height="1500" fill="url(#vig)"/>
</svg>
