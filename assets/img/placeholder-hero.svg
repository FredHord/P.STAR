<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder: long-exposure motion-blur figure mid-jump, monochrome">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.94  0 0 0 0 0.95  0 0 0 0 0.94  0 0 0 0.06 0"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurTight" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#0c0c0c"/>

  <!-- distant blurred trail arc -->
  <g filter="url(#blurWide)" opacity="0.5">
    <path d="M 300 900 Q 780 300 1180 260 Q 1420 240 1560 520" stroke="#f1f3ef" stroke-width="46" fill="none" stroke-linecap="round"/>
  </g>

  <!-- core motion-blur figure: torso/limb streaks converging on a jump -->
  <g filter="url(#blurTight)">
    <path d="M 860 760 C 900 620 930 480 960 360" stroke="#f1f3ef" stroke-width="30" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M 820 780 C 880 660 940 520 1000 380" stroke="#f1f3ef" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 960 360 C 1030 330 1110 320 1180 300" stroke="#f1f3ef" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 960 360 C 1010 400 1060 470 1090 560" stroke="#f1f3ef" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="965" cy="345" rx="34" ry="30" fill="#f1f3ef" opacity="0.9"/>
    <path d="M 780 800 C 800 900 820 970 800 1040" stroke="#f1f3ef" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 940 780 C 970 880 1010 950 1060 1000" stroke="#f1f3ef" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- secondary faint echo trails suggesting long exposure repetition -->
  <g filter="url(#blurWide)" opacity="0.28">
    <path d="M 700 820 C 760 660 820 520 900 400" stroke="#f1f3ef" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 1050 340 C 1140 320 1230 330 1300 380" stroke="#f1f3ef" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1920" height="1080" fill="url(#floorFade)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.5"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
