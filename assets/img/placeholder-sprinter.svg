<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder: long-exposure motion-blur sprinter, monochrome">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.94  0 0 0 0 0.95  0 0 0 0 0.94  0 0 0 0.06 0"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="blurTight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="vig" cx="46%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1500" fill="#0c0c0c"/>

  <!-- low horizontal speed trails -->
  <g filter="url(#blurWide)" opacity="0.4">
    <path d="M 60 1080 L 1140 1080" stroke="#f1f3ef" stroke-width="10" opacity="0.5"/>
    <path d="M 60 1010 C 400 990 800 985 1140 1000" stroke="#f1f3ef" stroke-width="16" fill="none"/>
  </g>

  <!-- forward-leaning driving figure -->
  <g filter="url(#blurTight)">
    <path d="M 480 1120 C 560 1000 660 900 760 830" stroke="#f1f3ef" stroke-width="30" fill="none" stroke-linecap="round" opacity="0.85"/>
    <ellipse cx="775" cy="812" rx="30" ry="27" fill="#f1f3ef" opacity="0.9"/>
    <path d="M 760 830 C 700 860 630 870 560 850" stroke="#f1f3ef" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 480 1120 C 430 1180 360 1220 280 1230" stroke="#f1f3ef" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 480 1120 C 520 1210 560 1290 540 1360" stroke="#f1f3ef" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 560 1000 C 500 1060 430 1090 350 1090" stroke="#f1f3ef" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- echo trails behind -->
  <g filter="url(#blurWide)" opacity="0.25">
    <path d="M 300 1140 C 380 1040 470 960 560 900" stroke="#f1f3ef" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M 120 1180 C 200 1120 280 1080 360 1070" stroke="#f1f3ef" stroke-width="14" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.5"/>
  <rect width="1200" height="1500" fill="url(#vig)"/>
</svg>
