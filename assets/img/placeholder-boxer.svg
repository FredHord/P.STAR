<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder: long-exposure motion-blur boxer, monochrome">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.94  0 0 0 0 0.95  0 0 0 0 0.94  0 0 0 0.06 0"/>
    </filter>
    <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="blurTight" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="vig" cx="52%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1500" fill="#0c0c0c"/>

  <!-- tight central burst: jab trail -->
  <g filter="url(#blurWide)" opacity="0.45">
    <path d="M 520 780 C 640 740 760 720 900 700" stroke="#f1f3ef" stroke-width="34" fill="none" stroke-linecap="round"/>
  </g>

  <g filter="url(#blurTight)">
    <ellipse cx="560" cy="760" rx="34" ry="30" fill="#f1f3ef" opacity="0.9"/>
    <path d="M 560 790 C 620 800 690 790 760 760" stroke="#f1f3ef" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 760 760 C 830 730 890 710 940 690" stroke="#f1f3ef" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 560 820 C 540 900 520 970 500 1040" stroke="#f1f3ef" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 590 830 C 610 920 630 1000 610 1080" stroke="#f1f3ef" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 540 780 C 480 800 420 790 370 750" stroke="#f1f3ef" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- ghost repeat punches -->
  <g filter="url(#blurWide)" opacity="0.22">
    <path d="M 560 820 C 680 800 800 780 920 760" stroke="#f1f3ef" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M 560 870 C 700 850 830 830 940 810" stroke="#f1f3ef" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.5"/>
  <rect width="1200" height="1500" fill="url(#vig)"/>
</svg>
